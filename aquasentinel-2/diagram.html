<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#374151"/></marker></defs>
<text x="750" y="40" text-anchor="middle" class="h">AquaSentinel AI 2.0 — Biết trước · Báo đúng người · Hành động ngay</text>
<text x="750" y="66" text-anchor="middle" class="n">Giữ nguyên trạm quan trắc + lấy mẫu + app + web cũ; thêm 3 lớp mới (viền đậm)</text>

<!-- column headers -->
<rect x="30" y="90" width="440" height="34" rx="8" fill="#0369a1"/><text x="250" y="112" text-anchor="middle" class="k">① BIẾT TRƯỚC — Cảm biến & dự báo</text>
<rect x="530" y="90" width="440" height="34" rx="8" fill="#7c3aed"/><text x="750" y="112" text-anchor="middle" class="k">② XỬ LÝ — Trung tâm AI</text>
<rect x="1030" y="90" width="440" height="34" rx="8" fill="#b91c1c"/><text x="1250" y="112" text-anchor="middle" class="k">③ HÀNH ĐỘNG — Tác động trực tiếp</text>

<!-- col 1 -->
<rect x="30" y="140" width="440" height="120" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="50" y="166" class="t">Trạm quan trắc nước (CŨ, giữ nguyên)</text>
<text x="50" y="190" class="s">Nhiệt độ · TDS · độ đục · lưu lượng · mực nước</text>
<text x="50" y="212" class="s">+ đề xuất thêm pH, cảm biến mưa (tipping bucket)</text>
<text x="50" y="234" class="s">Bơm lấy mẫu tự động khi vượt ngưỡng</text>

<rect x="30" y="275" width="440" height="140" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="3.5"/>
<text x="50" y="301" class="t">MỚI · Hộp "Cột Báo Ngập" trên cột điện/cây</text>
<text x="50" y="325" class="s">Siêu âm đo độ sâu nước mặt đường → mỗi hộp = 1 điểm đo ngập</text>
<text x="50" y="347" class="s">Đặt gần khu dân cư, chợ, trường, ngã tư hay ngập</text>
<text x="50" y="369" class="s">Pin mặt trời + LoRa mesh: chạy được khi mất điện, mất 4G</text>
<text x="50" y="391" class="s">Nút "Cần hỗ trợ" cho người già, người kẹt nước</text>

<rect x="30" y="430" width="440" height="110" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="3.5"/>
<text x="50" y="456" class="t">MỚI · Bẫy rác + First-flush ở miệng cống</text>
<text x="50" y="480" class="s">Cảm biến mức đầy lưới chắn rác (siêu âm / loadcell)</text>
<text x="50" y="502" class="s">Đo đợt nước đầu mùa mưa (bẩn nhất) chảy vào cống</text>
<text x="50" y="524" class="s">Van tách dòng first-flush → bể lọc sinh học</text>

<rect x="30" y="555" width="440" height="100" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="50" y="581" class="t">Dữ liệu ngoài + cộng đồng</text>
<text x="50" y="605" class="s">Dự báo mưa (API thời tiết), lịch triều cường Đà Nẵng</text>
<text x="50" y="627" class="s">Phản ánh ảnh/video của người dân (app cũ)</text>

<!-- col 2 -->
<rect x="530" y="140" width="440" height="515" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3.5"/>
<text x="550" y="170" class="t">Máy chủ FastAPI + MQTT (nâng cấp)</text>
<text x="550" y="202" class="s"><tspan font-weight="700">AI 1 · Phân biệt nguồn đục:</tspan></text>
<text x="565" y="224" class="s">đục + đang mưa + nước dâng = nước mưa chảy tràn</text>
<text x="565" y="246" class="s">TDS/đục tăng vọt + KHÔNG mưa + ban đêm = nghi xả thải</text>
<text x="565" y="268" class="s">→ giảm báo động giả, giữ chức năng bắt xả thải cũ</text>
<text x="550" y="302" class="s"><tspan font-weight="700">AI 2 · Dự báo ngập 1–3 giờ tới:</tspan></text>
<text x="565" y="324" class="s">lượng mưa + triều + tốc độ dâng mực nước + bẫy rác đầy</text>
<text x="565" y="346" class="s">mô hình hồi quy / cây quyết định học từ dữ liệu đã đo</text>
<text x="550" y="380" class="s"><tspan font-weight="700">Bản đồ ngập thời gian thực:</tspan></text>
<text x="565" y="402" class="s">nội suy độ sâu giữa các hộp + ảnh người dân gửi</text>
<text x="565" y="424" class="s">AI ước lượng độ sâu từ ảnh (bánh xe, bậc thềm, cột mốc sơn)</text>
<text x="565" y="446" class="s">→ tô màu tuyến đường, gợi ý đường tránh ngập</text>
<text x="550" y="480" class="s"><tspan font-weight="700">Điều phối:</tspan></text>
<text x="565" y="502" class="s">mưa lớn trong 24h + bẫy rác &gt; 60% đầy</text>
<text x="565" y="524" class="s">→ tạo lệnh "Dọn cống trước mưa" cho tổ dân phố/tình nguyện viên</text>
<text x="565" y="546" class="s">ngập sâu + nút SOS → tạo yêu cầu cứu trợ kèm vị trí</text>
<text x="550" y="580" class="s"><tspan font-weight="700">Kênh phát cảnh báo:</tspan></text>
<text x="565" y="602" class="s">LoRa về hộp cột · Zalo OA · push app · web quản lý</text>
<text x="565" y="624" class="s">Chỉ báo người trong bán kính bị ảnh hưởng</text>

<!-- col 3 -->
<rect x="1030" y="140" width="440" height="135" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3.5"/>
<text x="1050" y="166" class="t">Hộp cột phát cảnh báo tại chỗ</text>
<text x="1050" y="190" class="s">Đèn 3 màu xanh/vàng/đỏ thấy từ xa ban đêm</text>
<text x="1050" y="212" class="s">Loa phát giọng nói: "Đường Lê Duẩn ngập 40cm, tránh..."</text>
<text x="1050" y="234" class="s">Bảng LED: độ sâu hiện tại + xu hướng ↑↓</text>
<text x="1050" y="256" class="s">Không cần điện thoại — người già, trẻ em đều hiểu</text>

<rect x="1030" y="290" width="440" height="110" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3.5"/>
<text x="1050" y="316" class="t">Dọn cống TRƯỚC mưa (giảm ngập do tắc)</text>
<text x="1050" y="340" class="s">Lệnh dọn gửi đúng điểm sắp đầy rác, đúng lúc sắp mưa</text>
<text x="1050" y="362" class="s">App tính điểm "Chiến binh xanh" cho người dọn</text>
<text x="1050" y="384" class="s">Đo được: kg rác chặn được, số lần cống không bị tắc</text>

<rect x="1030" y="415" width="440" height="110" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3.5"/>
<text x="1050" y="441" class="t">Tách first-flush tự động</text>
<text x="1050" y="465" class="s">15–20 phút đầu cơn mưa: servo mở van → bể lắng/lọc</text>
<text x="1050" y="487" class="s">(cát, sỏi, than hoạt tính, cây thuỷ sinh) → nước sạch hơn ra kênh</text>
<text x="1050" y="509" class="s">Đo trước/sau lọc để chứng minh hiệu quả</text>

<rect x="1030" y="540" width="440" height="115" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1050" y="566" class="t">Giữ nguyên + mở rộng</text>
<text x="1050" y="590" class="s">Lấy mẫu nước làm bằng chứng xả thải (cũ)</text>
<text x="1050" y="612" class="s">Lấy thêm mẫu first-flush để so sánh mức ô nhiễm</text>
<text x="1050" y="634" class="s">Gọi cứu trợ có vị trí + độ sâu nước (cũ → chính xác hơn)</text>

<!-- bottom: why it's new -->
<rect x="30" y="690" width="1440" height="265" rx="14" fill="#f9fafb" stroke="#9ca3af"/>
<text x="50" y="722" class="t">Điểm đột phá so với bản cũ (dùng khi thuyết trình)</text>
<text x="50" y="752" class="s">1. Từ "cảnh báo" sang "hành động": hệ thống tự ra lệnh dọn cống trước mưa và tự tách dòng nước bẩn đầu mùa — tác động trực tiếp lên nguyên nhân gây ngập và ô nhiễm.</text>
<text x="50" y="778" class="s">2. Hạ tầng cảnh báo không cần smartphone: hộp cột điện có đèn + loa + bảng LED, chạy pin mặt trời qua LoRa mesh — vẫn hoạt động khi bão làm mất điện, mất sóng.</text>
<text x="50" y="804" class="s">3. Mỗi hộp vừa cảnh báo vừa là cảm biến ngập → mạng đo ngập dày đặc, rẻ, phủ đúng nơi dân sống (chợ, hẻm, trường học).</text>
<text x="50" y="830" class="s">4. AI phân biệt nước mưa chảy tràn với xả thải lén → một hệ thống dùng được cả mùa khô (bắt xả thải) lẫn mùa mưa (chống ngập), không báo động giả.</text>
<text x="50" y="856" class="s">5. Dữ liệu chứng minh tác động: kg rác chặn được, số giờ cảnh báo sớm, mức giảm TDS/độ đục sau bể lọc first-flush.</text>
<text x="50" y="890" class="n">Gợi ý thử nghiệm: 1 trạm quan trắc + 2 hộp cột (1 ở hẻm hay ngập, 1 ở chợ) + 1 bẫy rác + bể first-flush mô hình. Mô phỏng mưa bằng vòi tưới + đổ rác lá cây để demo trước giám khảo.</text>
<text x="50" y="916" class="n">LoRa tại Việt Nam: nên dùng băng 920–923 MHz (module SX1276/SX1262 bản 915/923) thay 433 MHz để đúng quy định thiết bị vô tuyến cự ly ngắn khi phát công suất cao.</text>
